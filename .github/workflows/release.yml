name: release

# Builds the hotkernels source distribution, builds the wheels from it, and
# tests both. For a pushed v* tag it then publishes them to PyPI, once the
# maintainer approves, and creates the GitHub release. See
# docs/release-design.md and docs/distribution-design.md.
#
# Who can publish. PyPI accepts uploads for hotkernels only from the `pypi`
# job below: trusted publishing, configured on pypi.org for this repository,
# this file and the `pypi` environment. That environment needs the
# maintainer's approval for every run and accepts only v* tags, and only the
# maintainer may push a v* tag (a repository ruleset). No PyPI token exists
# anywhere in the repository or its settings.
#
# Third-party actions are pinned to a commit, so a moved tag upstream cannot
# change what runs with publishing rights.

on:
  push:
    tags: ["v*"]
  # A change that could break a wheel builds and tests one before it merges.
  pull_request:
    paths:
      - "hotkernels/**"
      - "kernels/**"
      - "judge/build.py"
      - "judge/spec.py"
      - "release/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/pick-runner.yml"
  # A rehearsal: build, test and upload to TestPyPI.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    # The package builds on Linux without its extension, which is all `release verify`
    # needs, and Linux runners are plentiful where Apple Silicon ones queue.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `release verify` checks the tagged commit is on origin/main
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # For a tag: the tag names the version in meson.build, the commit is on
      # main, and the release notes are finished. Otherwise only reads the version.
      - id: verify
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run release verify --tag "$GITHUB_REF_NAME"
          else
            uv run release verify
          fi

  build:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The source distribution carries its own kernel set (tools/generate.py dist),
      # so it builds with no checkout next to it.
      - id: sdist
        run: |
          uv build --sdist hotkernels --out-dir dist
          echo "path=$(ls dist/hotkernels-*.tar.gz)" >> "$GITHUB_OUTPUT"
      # The wheels are built from the source distribution, which proves it builds.
      # Settings are in [tool.cibuildwheel] in hotkernels/pyproject.toml.
      # cibuildwheel installs each Python system-wide, which only a hosted runner
      # allows. Every wheel that is published is built this way: a tag always
      # runs hosted.
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        if: needs.runner.outputs.runner == 'macos-15'
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: dist
      # On the maintainer's Mac the same wheels are built by uv, with the
      # settings [tool.cibuildwheel] gives: one wheel per Python, C kernels
      # compiled for the first Apple Silicon Mac, macOS 11 as the oldest target.
      # The test jobs then check them as they check cibuildwheel's.
      - if: needs.runner.outputs.runner != 'macos-15'
        env:
          SDIST: ${{ steps.sdist.outputs.path }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          for python in 3.11 3.12 3.13 3.14; do
            uv build --wheel --python "$python" -C setup-args=-Dkernel_cpu=apple-m1 --out-dir dist "$SDIST"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # The Linux x86-64 wheels, built by cibuildwheel from the same source
  # distribution in a manylinux container. Settings are in [tool.cibuildwheel]
  # in hotkernels/pyproject.toml. Its test command installs each wheel in a
  # fresh environment and checks that kernels are installed, which needs a
  # processor with the x86-64-v3 instruction sets; the hosted runners have one.
  build-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: sdist
      - id: sdist
        run: echo "path=$(ls sdist/hotkernels-*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: dist/*.whl
          if-no-files-found: error

  # Any other platform builds the source distribution into a package that
  # installs and does nothing. Linux on ARM64 is such a platform, and the slim
  # image has no C compiler, which the build must not need there.
  other-platforms:
    needs: build
    runs-on: ubuntu-24.04-arm
    container: python:3.12-slim
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: |
          pip install dist/hotkernels-*.tar.gz
          cd /tmp
          python -c "import hotkernels; hotkernels.install(); r = hotkernels.report(); print(r); assert not r.installed and 'macOS on ARM64 or Linux on x86-64' in r.unsupported, r"
          python -m hotkernels --help

  # Every hooked NumPy call, and NumPy's own test suite, with and without
  # hotkernels, against each wheel as built for release rather than the
  # package built from the checkout.
  # Where the macOS jobs run: the maintainer's Mac when it is online, except
  # for a tag, whose wheels are published and are built and tested hosted.
  runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  test:
    needs: [build, runner]
    runs-on: ${{ needs.runner.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", tag: cp311 }
          - { python: "3.12", tag: cp312 }
          - { python: "3.13", tag: cp313 }
          - { python: "3.14", tag: cp314 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - env:
          PYTHON: ${{ matrix.python }}
          WHEEL_TAG: ${{ matrix.tag }}
        run: |
          uv sync --python "$PYTHON"
          # Replace the package built from the checkout with the release wheel.
          uv pip install --reinstall dist/hotkernels-*-"$WHEEL_TAG"-"$WHEEL_TAG"-*.whl
          uv run --no-sync delivery check
          # NumPy's own test suite, both ways, against the same wheel.
          uv run --no-sync delivery numpy-tests

  # The same checks against each Linux wheel.
  test-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", tag: cp311 }
          - { python: "3.12", tag: cp312 }
          - { python: "3.13", tag: cp313 }
          - { python: "3.14", tag: cp314 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux
          path: dist
      - env:
          PYTHON: ${{ matrix.python }}
          WHEEL_TAG: ${{ matrix.tag }}
        run: |
          uv sync --python "$PYTHON"
          # Replace the package built from the checkout with the release wheel.
          uv pip install --reinstall dist/hotkernels-*-"$WHEEL_TAG"-"$WHEEL_TAG"-*.whl
          uv run --no-sync delivery check
          # NumPy's own test suite, both ways, against the same wheel.
          uv run --no-sync delivery numpy-tests

  pypi:
    if: github.ref_type == 'tag'
    needs: [version, test, test-linux, other-platforms]
    runs-on: ubuntu-latest
    # The gate: this job waits until the maintainer approves it, and PyPI
    # accepts an upload only from a job in this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/hotkernels/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write # trusted publishing: proves to PyPI which workflow and environment this is
    steps:
      # Both artifacts: the source distribution and the macOS wheels, and the
      # Linux wheels.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [version, test, test-linux, other-platforms]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hotkernels/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      # Both artifacts: the source distribution and the macOS wheels, and the
      # Linux wheels.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal of a version already rehearsed is not a failure.
          skip-existing: true

  github-release:
    needs: [version, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "hotkernels $VERSION" --notes-file "release-notes/$VERSION.md" "${flags[@]}"
