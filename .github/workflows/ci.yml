name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The maintainer's Mac when it is online, a hosted macOS runner otherwise.
  runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  judge:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }} # Apple Silicon either way
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Shared runners are too noisy to time anything, so the speed fixture is skipped.
      - run: uv run judge selftest --no-speed
      # The one kernel whose reference C differs by architecture: NumPy's ARM64
      # build fuses the last multiply and add of np.interp and its x86-64 build
      # does not. Checked on each platform, reference and assembly, against the
      # NumPy of that platform. `--unlocked` because CI checks what the pull
      # request holds, a changed reference included; the lock is for kernel runs.
      - run: uv run judge check interp_f64 --unlocked
      # Every hooked NumPy call, with and without hotkernels installed, on the
      # NumPy in uv.lock.
      - run: uv run delivery check

  # The same check at both ends of the NumPy range hotkernels claims: exactly
  # the floor of `numpy` in hotkernels/pyproject.toml, and the newest release
  # on PyPI. hotkernels is built against the newest NumPy in both, as a wheel
  # is, so the first step also shows that such a build runs on the oldest.
  numpy-range:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }} # Apple Silicon either way
    env:
      VERSIONS: 'import sys, numpy; print(f"Python {sys.version.split()[0]}, NumPy {numpy.__version__}")'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # `--with` lays the old NumPy over the locked one when the check runs.
      # Python 3.13 is the newest that NumPy 2.3.0 has wheels for, so it is the
      # last to lose a newer NumPy to build against.
      - name: delivery check on the oldest NumPy hotkernels claims
        run: |
          oldest=$(sed -nE 's/^ *"numpy>=([0-9.]+)",$/\1/p' hotkernels/pyproject.toml)
          uv run --python 3.13 --with "numpy==$oldest" python -c "$VERSIONS"
          uv run --python 3.13 --with "numpy==$oldest" delivery check
      # Relocks NumPy to its newest release, on the newest Python the wheels
      # are built for, which a new NumPy supports first.
      - name: delivery check on the newest NumPy
        run: |
          uv run --python 3.14 --upgrade-package numpy python -c "$VERSIONS"
          uv run --python 3.14 --upgrade-package numpy delivery check

  # The judge and the package on their second platform. The hosted runners'
  # processors have the x86-64-v3 instruction sets the kernels need; if one
  # did not, install() would do nothing and the delivery check would say so.
  judge-linux:
    runs-on: ubuntu-latest # x86-64, with clang and GNU binutils installed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run judge selftest --no-speed
      # As in the macOS job: the reference of interp_f64 differs by architecture.
      - run: uv run judge check interp_f64 --unlocked
      # Every hooked NumPy call, with and without hotkernels installed, on the
      # NumPy in uv.lock, with the x86-64 kernels.
      - run: uv run delivery check
      - run: |
          status=0
          uv run judge check cumfmax_f64 --unlocked || status=1
          uv run judge check fmax_reduce_f64 --unlocked || status=1
          exit $status
