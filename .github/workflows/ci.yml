name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Runs every job on any branch: such a run has no list of changed paths.
  workflow_dispatch:

# The macOS jobs queue for the maintainer's runners, so a run nobody will read
# gives way. On a pull request a newer push cancels the unfinished run. On main
# the running run finishes, and a newer push replaces the one still waiting.
# See docs/ci-queue-design.md.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs the change needs, from the paths it touches: none for a change
  # to documentation alone, and numpy-range on a pull request only when it
  # touches what that job checks. The rules are in .github/scripts/ci-scope.sh.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
      numpy_range: ${{ steps.scope.outputs.numpy_range }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # The files of the whole pull request, or of the push. A list that
          # cannot be read, or reaches the API's limit (3,000 files for a pull
          # request, 300 for a comparison), is left empty, and an empty list
          # runs everything. So does a push that creates the branch, whose
          # `before` is all zeros, and a run started by hand.
          files=""
          limit=0
          if [ "$EVENT" = pull_request ]; then
            limit=3000
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') || files=""
          elif [ "$EVENT" = push ] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            limit=300
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq '.files[].filename') || files=""
          fi
          count=$(grep -c . <<< "$files" || true)
          if [ "$count" -ge "$limit" ]; then files=""; fi
          echo "$count changed paths"
          .github/scripts/ci-scope.sh <<< "$files" | tee -a "$GITHUB_OUTPUT"

  # The maintainer's Mac when it is online, a hosted macOS runner otherwise.
  runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  judge:
    needs: [runner, scope]
    if: needs.scope.outputs.tests == 'true'
    runs-on: ${{ needs.runner.outputs.runner }} # Apple Silicon either way
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Shared runners are too noisy to time anything, so the speed fixture is skipped.
      - run: uv run judge selftest --no-speed
      # The one kernel whose reference C differs by architecture: NumPy's ARM64
      # build fuses the last multiply and add of np.interp and its x86-64 build
      # does not. Checked on each platform, reference and assembly, against the
      # NumPy of that platform. `--unlocked` because CI checks what the pull
      # request holds, a changed reference included; the lock is for kernel runs.
      - run: uv run judge check interp_f64 --unlocked
      # The same for nanstd_cols_f64, whose reference fuses its square and add
      # on ARM64 and not on x86-64, as bottleneck's builds do. Its oracle is
      # the bottleneck installed on the platform.
      - run: uv run judge check nanstd_cols_f64 --unlocked
      # Every hooked NumPy call, with and without hotkernels installed, on the
      # NumPy in uv.lock.
      - run: uv run delivery check
      # NumPy's own test suite, with and without hotkernels installed; a test
      # whose outcome differs is run again before it fails the job. About two
      # minutes. See docs/numpy-tests-ci-design.md.
      - run: uv run delivery numpy-tests

  # The same check at both ends of the NumPy range hotkernels claims: exactly
  # the floor of `numpy` in hotkernels/pyproject.toml, and the newest release
  # on PyPI. hotkernels is built against the newest NumPy in both, as a wheel
  # is, so the first step also shows that such a build runs on the oldest.
  numpy-range:
    needs: [runner, scope]
    # Every run on main that is not documentation; on a pull request, only
    # when it touches what this job checks.
    if: needs.scope.outputs.tests == 'true' && (github.event_name != 'pull_request' || needs.scope.outputs.numpy_range == 'true')
    runs-on: ${{ needs.runner.outputs.runner }} # Apple Silicon either way
    env:
      VERSIONS: 'import sys, numpy; print(f"Python {sys.version.split()[0]}, NumPy {numpy.__version__}")'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # `--with` lays the old NumPy over the locked one when the check runs.
      # Python 3.13 is the newest that NumPy 2.3.0 has wheels for, so it is the
      # last to lose a newer NumPy to build against.
      - name: delivery check on the oldest NumPy hotkernels claims
        run: |
          oldest=$(sed -nE 's/^ *"numpy>=([0-9.]+)",$/\1/p' hotkernels/pyproject.toml)
          uv run --python 3.13 --with "numpy==$oldest" python -c "$VERSIONS"
          uv run --python 3.13 --with "numpy==$oldest" delivery check
      # Relocks NumPy to its newest release, on the newest Python the wheels
      # are built for, which a new NumPy supports first.
      - name: delivery check on the newest NumPy
        run: |
          uv run --python 3.14 --upgrade-package numpy python -c "$VERSIONS"
          uv run --python 3.14 --upgrade-package numpy delivery check

  # The judge and the package on their second platform. The hosted runners'
  # processors have the x86-64-v3 instruction sets the kernels need; if one
  # did not, install() would do nothing and the delivery check would say so.
  judge-linux:
    needs: scope
    if: needs.scope.outputs.tests == 'true'
    runs-on: ubuntu-latest # x86-64, with clang and GNU binutils installed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run judge selftest --no-speed
      # As in the macOS job: the reference of interp_f64 differs by architecture.
      - run: uv run judge check interp_f64 --unlocked
      # As in the macOS job: nanstd_cols_f64 against this platform's bottleneck.
      - run: uv run judge check nanstd_cols_f64 --unlocked
      # Every hooked NumPy call, with and without hotkernels installed, on the
      # NumPy in uv.lock, with the x86-64 kernels.
      - run: uv run delivery check
      # NumPy's own test suite, both ways, as in the macOS job.
      - run: uv run delivery numpy-tests
      # The tests of the delivery tool's own code: the sizes and records of
      # `delivery apps` and the parsing of the Linux profile. They time nothing.
      - run: uv run --group dev pytest tests
