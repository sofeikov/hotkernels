<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 634" width="936" height="634" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t d">
<title id="t">Speedup of whole programs with hotkernels installed</title>
<desc id="d">Horizontal bars, one per program, showing how many times faster it runs after hotkernels.install() than on plain NumPy 2.5.5: ten applications on an Apple M1 Pro and nine workloads on an Apple M4 Max. The values are in the table that follows the chart in the README.</desc>
<rect x="0.5" y="0.5" width="935" height="633" rx="12" fill="#0d1117" stroke="#30363d"/>
<g transform="translate(28 28)">
<text x="0" y="20" font-size="16" font-weight="600" fill="#f0efec">Whole programs, with and without hotkernels</text>
<text x="0" y="40" font-size="12" fill="#c3c2b7">Times faster with the one line added, on plain NumPy 2.5.5. Each program gave the same results bit for bit.</text>
<rect x="0" y="58" width="12" height="12" rx="2" fill="#3987e5"/>
<text x="18" y="68" font-size="12" fill="#c3c2b7">Apple M1 Pro, applications at their large size</text>
<rect x="343.59999999999997" y="58" width="12" height="12" rx="2" fill="#e08a2c"/>
<text x="361.59999999999997" y="68" font-size="12" fill="#c3c2b7">Apple M4 Max, workloads at size M (example: S)</text>
<line x1="190.0" y1="90" x2="190.0" y2="550" stroke="#3d444d" stroke-width="1"/>
<text x="190.0" y="566" font-size="11" text-anchor="middle" fill="#9a9890">0x</text>
<line x1="293.3" y1="90" x2="293.3" y2="550" stroke="#262b33" stroke-width="1"/>
<text x="293.3" y="566" font-size="11" text-anchor="middle" fill="#9a9890">1x</text>
<line x1="396.7" y1="90" x2="396.7" y2="550" stroke="#262b33" stroke-width="1"/>
<text x="396.7" y="566" font-size="11" text-anchor="middle" fill="#9a9890">2x</text>
<line x1="500.0" y1="90" x2="500.0" y2="550" stroke="#262b33" stroke-width="1"/>
<text x="500.0" y="566" font-size="11" text-anchor="middle" fill="#9a9890">3x</text>
<line x1="603.3" y1="90" x2="603.3" y2="550" stroke="#262b33" stroke-width="1"/>
<text x="603.3" y="566" font-size="11" text-anchor="middle" fill="#9a9890">4x</text>
